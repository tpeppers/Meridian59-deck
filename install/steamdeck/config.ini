Configuration file for Meridian 59 -- Steam Deck defaults


This is the stock config.ini with the Steam Deck's screen, battery and
controls in mind.  Everything in it is a normal client setting; nothing here
is Deck-only, so the same file works on a desktop with a controller plugged
in.  See install/steamdeck/README.md for the full control chart.

The [config] section contains the following options:

initialized:  Set this to false (or delete this file) to have Meridian create a default config.ini file for you
classickeybindings:  Set this to true to enable key bindings identical to the old Meridian client (later key bindings are ignored)
invertmouse:  Set to true to invert mouselook's y-axis
mouselookxscale/mouselookyscale:  Sets the mouse sensitivity.  Accepts any value from 1 to 30
quickchat:  Set to true to have all alphabetic keys go instantly to chat (any later key binding using an alphabetic key will be ignored)
alwaysrun:  Set to true to avoid having to hold the run key (default: shift) to run
dynamiclighting:  Set to true to enable dynamic lighting.  Setting this to false may increase performance on some systems

gpuefficiency:  Set to true to cap the frame rate at 60, render at 800x600 and present on vblank.  This is the right setting for the Deck: the panel is 60Hz, so the frames a faster setting would draw are thrown away, and the battery pays for them

softwarerenderer:  Set to true to force the client to run in software graphics mode

rendererfailedonce:  NOT USER EDITABLE.  The client will set this to true when it determines that your hardware/driver cannot run Meridian in Direct3D.  This will prevent any further error messages until you either delete this file or change video cards/drivers

Gamepad settings, all in the [config] section:

gamepad:  Set to false to ignore controllers entirely
gamepadlookxscale/gamepadlookyscale:  Look stick sensitivity, 1 to 30.  10 turns a fully deflected stick at the same rate as holding the keyboard's run+turn keys
gamepadinverty:  Set to true to push the look stick down to look up
gamepadalwaysrun:  Set to true to run at any stick deflection.  Off by default, because how far you push the stick is what decides walk or run
gamepadmovedeadzone/gamepadlookdeadzone:  Stick dead zones as a percentage of travel, 0 to 90
gamepadtriggerthreshold:  How far a trigger must be pulled to count as pressed, as a percentage, 0 to 90

The [keys] section represents your key bindings.  It uses the following format:

<action>=<key>[+<modifier>]

Where <key> can be any of the following keys:

a-z, mouse0-mouse5, pageup, pagedown, home, end, delete, enter, space, up, down, left, right, esc, tab, ',', ';', '.', ''', '[', or ']'

And the optional <modifier> can be: shift, alt, ctrl, or any

Use 'any' for keys that you would like to work inclusively with all other actions.  Some good examples of this are the 'attack' and 'mouselooktoggle' actions

The [gamepad] section maps controller buttons to the same actions.  Button
names are: a, b, x, y, leftshoulder, rightshoulder, lefttrigger,
righttrigger, dpadup, dpaddown, dpadleft, dpadright, leftstick, rightstick,
view, menu.  On the Steam Deck, "view" is the button above the left stick and
"menu" is the button above the right stick.  The sticks themselves are not
bindable: the left one always moves and the right one always looks.

[config]
initialized=true
classickeybindings=false
invertmouse=false
mouselookxscale=15
mouselookyscale=9
quickchat=false
alwaysrun=true
attackontarget=false
dynamiclighting=true
softwarerenderer=false
gpuefficiency=true
gamepad=true
gamepadlookxscale=15
gamepadlookyscale=10
gamepadinverty=false
gamepadalwaysrun=false
gamepadmovedeadzone=18
gamepadlookdeadzone=15
gamepadtriggerthreshold=30
[keys]
forward=w
backward=s
left=left
right=right
slideleft=a
slideright=d
run/walk=shift
lookup=pageup
lookdown=pagedown
attack=e+any
open=space
say=f
chat=enter
tell=t
yell=y
broadcast=b
lookstraight=home
flip=end
who=w+ctrl
look=l
pickup=g
offer=o+ctrl
buy=b+ctrl
deposit=d+shift
withdraw=w+shift
targetnext=]
targetprevious=[
emote=;
map=m+shift
examine=mouse1+any
mouselooktoggle=c+any
mousetarget=mouse0
targetclear=esc
targetself=q
tabforward=tab
tabbackward=tab+shift
mapzoomin=add
mapzoomout=subtract
[gamepad]
a=open
b=targetclear
x=pickup
y=look
leftshoulder=targetprevious
rightshoulder=targetnext
lefttrigger=targetself
righttrigger=attack
dpadup=lookup
dpaddown=lookdown
dpadleft=mapzoomout
dpadright=mapzoomin
leftstick=flip
rightstick=lookstraight
view=map
menu=fullscreen
